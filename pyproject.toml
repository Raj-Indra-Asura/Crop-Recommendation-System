[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, D: docstrings, UP: modern syntax
select = ["E", "W", "F", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; module docstrings still required.
"tests/*" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path so `pytest` (not just `python -m pytest`)
# can import `src` and `tests` without the project being pip-installed.
pythonpath = ["."]
